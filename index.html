<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iris Species Classifier</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Iris Species Classifier</h1>
    <p>Enter an iris flower's measurements to predict its species.</p>
  </header>

  <main>
    <section id="predictor">
      <h2>Predict the Species</h2>
      <p>Enter the four measurements in centimetres and click Predict.</p>

      <div class="form-grid">
        <label>Sepal length (cm)
          <input type="number" id="sepal_length" min="4" max="8" step="0.1" placeholder="e.g. 5.1">
        </label>
        <label>Sepal width (cm)
          <input type="number" id="sepal_width" min="2" max="4.5" step="0.1" placeholder="e.g. 3.5">
        </label>
        <label>Petal length (cm)
          <input type="number" id="petal_length" min="1" max="7" step="0.1" placeholder="e.g. 1.4">
        </label>
        <label>Petal width (cm)
          <input type="number" id="petal_width" min="0.1" max="2.6" step="0.1" placeholder="e.g. 0.2">
        </label>
      </div>

      <button id="predict-btn">Predict</button>
      <button id="clear-btn" class="secondary">Clear</button>

      <div id="result" class="result hidden"></div>
    </section>
  </main>

  <footer>
    <p>
      K-Nearest Neighbours (k = 5) trained on the Iris dataset. Test accuracy: 93.33%.<br>
    </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
